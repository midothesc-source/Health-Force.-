<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HealthForce</title>
  <style>
    :root {
      --bg: #090D16;
      --surface: #111827;
      --surface-elevated: #172033;
      --pill: #1E293B;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --primary: #10B981;
      --primary-soft: rgba(16, 185, 129, 0.16);
      --primary-border: rgba(16, 185, 129, 0.35);
      --secondary: #F59E0B;
      --secondary-soft: rgba(245, 158, 11, 0.16);
      --secondary-border: rgba(245, 158, 11, 0.35);
      --tertiary: #8B5CF6;
      --tertiary-soft: rgba(139, 92, 246, 0.16);
      --tertiary-border: rgba(139, 92, 246, 0.35);
      --danger: #FB7185;
      --danger-soft: rgba(251, 113, 133, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-image:
        radial-gradient(circle at 15% 8%, var(--primary-soft), transparent 46%),
        radial-gradient(circle at 86% 88%, var(--tertiary-soft), transparent 45%);
      background-attachment: fixed;
      padding-bottom: 84px;
    }

    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 14px 24px;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand-col {
      min-width: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .date-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition: transform 0.12s ease, border-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Cards & Layout */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .badge-soft {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-primary {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .badge-secondary {
      background: var(--secondary-soft);
      color: var(--secondary);
      border: 1px solid var(--secondary-border);
    }

    .badge-tertiary {
      background: var(--tertiary-soft);
      color: var(--tertiary);
      border: 1px solid var(--tertiary-border);
    }

    /* Theme Bar */
    .theme-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .theme-strip::-webkit-scrollbar { display: none; }

    .theme-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .theme-pill.active {
      background: var(--surface-elevated);
      border-color: var(--primary);
      color: var(--text);
    }

    .swatch-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Context Selector */
    .pill-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pill-row::-webkit-scrollbar { display: none; }

    .context-pill {
      min-height: 42px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .context-pill.active {
      background: var(--tertiary-soft);
      border-color: var(--tertiary);
      color: var(--tertiary);
    }

    .context-note {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* Dual Circular Progress Summary */
    .rings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ring-tile {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ring-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 6px 0 8px;
    }

    .ring-wrap svg {
      width: 92px;
      height: 92px;
      transform: rotate(-90deg);
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-pct {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .ring-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .ring-title {
      font-size: 13px;
      font-weight: 700;
    }

    .ring-detail {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kpi-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 12px;
    }

    .kpi-label {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .kpi-val {
      font-size: 17px;
      font-weight: 800;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Timeline & Presets */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
    }

    .list-item.clickable {
      cursor: pointer;
    }

    .list-item.clickable:active {
      transform: scale(0.99);
    }

    .item-main {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .kcal-tag {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .del-btn {
      min-width: 38px;
      min-height: 38px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid rgba(251, 113, 133, 0.3);
      color: var(--danger);
      font-weight: 700;
      cursor: pointer;
    }

    /* Forms */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    input, select, textarea {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary, .btn-secondary, .btn-danger {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--bg);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--bg);
    }

    .btn-outline {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: var(--danger-soft);
      border: 1px solid rgba(251, 113, 133, 0.35);
      color: var(--danger);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      min-height: 20px;
      accent-color: var(--primary);
    }

    /* Progress Bar */
    .bar-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--pill);
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .choice-chip {
      min-height: 44px;
      border-radius: 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .choice-chip.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .pace-card {
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .pace-card.active {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
    }

    .nav-btn {
      min-height: 52px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 40;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      padding: 18px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .theme-card {
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      border-radius: 14px;
      padding: 11px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .theme-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .swatch-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--primary-border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .chart-box {
      width: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-col">
        <div class="brand-row">
          <span class="brand-dot"></span>
          <span class="brand-title">HealthForce</span>
        </div>
        <div id="todayDateLabel" class="date-sub"></div>
      </div>
      <div class="top-actions">
        <div id="streakPill" class="streak-pill" title="Consistency streak">🔥 0d</div>
        <button id="openThemesBtn" class="icon-btn" type="button" aria-label="Choose Theme" title="Themes">🎨</button>
        <button id="openSettingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Quick 5-Theme Selector Strip -->
    <div id="quickThemeStrip" class="theme-strip" style="margin-bottom: 12px;"></div>

    <!-- Main Dynamic View -->
    <main id="mainContent" class="stack"></main>
  </div>

  <!-- Bottom Tab Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-btn" data-tab="food" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M15 3v18M15 8h4a2 2 0 0 0 2-2V3"/></svg>
      <span>Log Food</span>
    </button>
    <button class="nav-btn" data-tab="walk" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="4" r="2"/><path d="m10 10 2.5-2 3.5 3 3 1M9 21l2-6 3 2 1 4M7 14l3-4"/></svg>
      <span>Log Walk</span>
    </button>
    <button class="nav-btn" data-tab="trends" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg>
      <span>Trends</span>
    </button>
  </nav>

  <!-- Theme Studio Modal -->
  <div id="themeModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Theme Studio">
    <div class="modal-sheet">
      <div class="card-header">
        <div>
          <div class="card-title">Theme Studio (5 Themes)</div>
          <div class="date-sub">Saved offline automatically on your device</div>
        </div>
        <button id="closeThemeModal" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div id="themeModalGrid" class="theme-grid"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="modal-sheet">
      <div class="card-header">
        <div>
          <div class="card-title">Targets &amp; Local Backup</div>
          <div class="date-sub">Stored offline in localStorage</div>
        </div>
        <button id="closeSettingsModal" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="two-col">
        <div class="field-group">
          <label class="field-label" for="setWeight">Weight (kg)</label>
          <input id="setWeight" type="number" step="0.1" />
        </div>
        <div class="field-group">
          <label class="field-label" for="setBmr">Est. BMR (kcal)</label>
          <input id="setBmr" type="number" />
        </div>
      </div>
      <div class="two-col">
        <div class="field-group">
          <label class="field-label" for="setNeat">Base NEAT (kcal)</label>
          <input id="setNeat" type="number" />
        </div>
        <div class="field-group">
          <label class="field-label" for="setWalkMins">Walk Goal (min)</label>
          <input id="setWalkMins" type="number" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="setWalkKcal">Daily Active Burn Goal (kcal)</label>
        <input id="setWalkKcal" type="number" />
      </div>
      <button id="saveSettingsBtn" class="btn-primary" type="button" style="margin-bottom: 12px;">Save Targets</button>

      <div class="two-col" style="margin-bottom: 10px;">
        <button id="exportJsonBtn" class="btn-outline" type="button">Copy JSON Backup</button>
        <button id="importJsonBtn" class="btn-outline" type="button">Restore JSON</button>
      </div>
      <button id="clearSampleBtn" class="btn-danger" type="button">Clear Sample Data &amp; Start Fresh</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (function () {
      const STORAGE_KEY = "healthforce_state_v1";
      const THEME_KEY = "healthforce_theme_v1";

      const THEMES = [
        {
          id: "midnight_emerald",
          name: "Midnight Emerald",
          desc: "Deep slate · Emerald & amber",
          vars: {
            "--bg": "#090D16",
            "--surface": "#111827",
            "--surface-elevated": "#172033",
            "--pill": "#1E293B",
            "--border": "rgba(255,255,255,0.08)",
            "--border-strong": "rgba(255,255,255,0.16)",
            "--text": "#F8FAFC",
            "--text-secondary": "#94A3B8",
            "--text-muted": "#64748B",
            "--primary": "#10B981",
            "--primary-soft": "rgba(16,185,129,0.16)",
            "--primary-border": "rgba(16,185,129,0.35)",
            "--secondary": "#F59E0B",
            "--secondary-soft": "rgba(245,158,11,0.16)",
            "--secondary-border": "rgba(245,158,11,0.35)",
            "--tertiary": "#8B5CF6",
            "--tertiary-soft": "rgba(139,92,246,0.16)",
            "--tertiary-border": "rgba(139,92,246,0.35)"
          }
        },
        {
          id: "aurora_borealis",
          name: "Aurora Borealis",
          desc: "Arctic night · Teal & prism",
          vars: {
            "--bg": "#050E17",
            "--surface": "#0B1929",
            "--surface-elevated": "#102438",
            "--pill": "#16304A",
            "--border": "rgba(94,234,212,0.12)",
            "--border-strong": "rgba(94,234,212,0.25)",
            "--text": "#F0FDFA",
            "--text-secondary": "#99B8CC",
            "--text-muted": "#5D7E96",

      const METABOLIC_STATES = {
        NORMAL_ENERGY: {
          label: "Normal Energy",
          offset: 0,
          note: "Steady baseline today. Focus on consistent meal logging and your active walking goal."
        },
        MEDICATION_DRAG: {
          label: "Medication Drag",
          offset: 150,
          note: "Scale fluctuations likely reflect water retention or slowed motility—not fat gain. Prioritize hydration and gentle movement."
        },
        HIGH_STRESS_LOW_SLEEP: {
          label: "High Stress / Low Sleep",
          offset: 250,
          note: "Elevated cortisol increases fluid retention and cravings. Focus on recovery, gentle walks, and near-maintenance intake."
        }
      };

      const PACES = [
        { id: "CASUAL_STROLL", name: "Casual Stroll", sub: "Gentle recovery pace", met: 2.8, speed: 3.5 },
        { id: "BRISK_WALK", name: "Brisk Walk", sub: "Steady aerobic stride", met: 4.0, speed: 5.2 },
        { id: "FAST_PACE", name: "Fast Pace", sub: "Power walk / incline", met: 5.3, speed: 6.4 }
      ];

      const DEFAULT_PRESETS = [
        { id: "p1", name: "Boiled Pasta with Eggs (1 plate)", calories: 480, category: "Lunch" },
        { id: "p2", name: "Koshary (Medium bowl)", calories: 650, category: "Lunch" },
        { id: "p3", name: "Gebna Qareesh + 2 Eggs + 1 Balady Bread", calories: 430, category: "Breakfast" },
        { id: "p4", name: "Shakshouka with Rice (1 serving)", calories: 510, category: "Dinner" },
        { id: "p5", name: "Sausage Pizza (2 slices)", calories: 560, category: "Dinner" },
        { id: "p6", name: "Tea with Milk & 2 Spoons Sugar", calories: 95, category: "Drink/Snack" },
        { id: "p7", name: "Fury Energy Drink (1 can)", calories: 115, category: "Drink/Snack" },
        { id: "p8", name: "1 Balady Bread Loaf", calories: 230, category: "Breakfast" }
      ];

      function todayKey(offsetDays = 0) {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().slice(0, 10);
      }

      function shortDayLabel(isoDay) {
        if (isoDay === todayKey(0)) return "Today";
        if (isoDay === todayKey(-1)) return "Yest";
        const [y, m, d] = isoDay.split("-").map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short" });
      }

      function buildInitialState() {
        const foods = [];
        const walks = [];
        const weights = [];
        const contexts = {};

        const sampleWeights = [
          { offset: -6, w: 88.2, tag: "Normal" },
          { offset: -5, w: 88.0, tag: "Normal" },
          { offset: -4, w: 88.7, tag: "Bloated / Water Retention" },
          { offset: -3, w: 87.9, tag: "Normal" },
          { offset: -2, w: 87.7, tag: "Normal" },
          { offset: -1, w: 88.1, tag: "Post-Meal" },
          { offset: 0, w: 87.5, tag: "Normal" }
        ];

        sampleWeights.forEach((item, idx) => {
          const day = todayKey(item.offset);
          contexts[day] = item.offset === -4 ? "MEDICATION_DRAG" : item.offset === -1 ? "HIGH_STRESS_LOW_SLEEP" : "NORMAL_ENERGY";
          weights.push({ day, weightKg: item.w, tag: item.tag });
          walks.push({
            id: "w_seed_" + idx,
            day,
            time: "5:30 PM",
            durationMinutes: item.offset === 0 ? 35 : 42 + (idx % 3) * 5,
            pace: item.offset === -4 ? "CASUAL_STROLL" : "BRISK_WALK",
            distanceKm: item.offset === 0 ? 3.0 : 3.6,
            caloriesBurned: item.offset === 0 ? 220 : 265 + idx * 8
          });
        });

        // Seed today's starter meals
        foods.push(
          { id: "f_seed_1", day: todayKey(0), time: "9:15 AM", name: "Gebna Qareesh + 2 Eggs + 1 Balady Bread", calories: 430, category: "Breakfast" },
          { id: "f_seed_2", day: todayKey(0), time: "11:30 AM", name: "Tea with Milk & 2 Spoons Sugar", calories: 95, category: "Drink/Snack" },
          { id: "f_seed_3", day: todayKey(0), time: "3:10 PM", name: "Koshary (Medium bowl)", calories: 650, category: "Lunch" }
        );
        // Seed past 6 days minimal food entries so streak is 7 days
        for (let i = -6; i <= -1; i++) {
          foods.push({
            id: "f_seed_day_" + i,
            day: todayKey(i),
            time: "2:00 PM",
            name: "Balanced Meal Log",
            calories: 1650 + (i % 2) * 140,
            category: "Lunch"
          });
        }

        return {
          settings: {
            bodyWeightKg: 87.5,
            estimatedBmrKcal: 1850,
            baseNeatKcal: 300,
            dailyWalkGoalMinutes: 45,
            dailyWalkGoalKcal: 300
          },
          contexts,
          presets: [...DEFAULT_PRESETS],
          foods,
          walks,
          weights
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        const seeded = buildInitialState();
        saveState(seeded);
        return seeded;
      }

      function saveState(nextState) {
        state = nextState;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      let state = loadState();
      let currentTab = "today";
      let currentThemeId = localStorage.getItem(THEME_KEY) || THEMES[0].id;
      let walkDuration = 30;
      let walkPaceId = "BRISK_WALK";

      function applyTheme(themeId, persist = true) {
        const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
        currentThemeId = theme.id;
        Object.entries(theme.vars).forEach(([k, v]) => {
          document.documentElement.style.setProperty(k, v);
        });
        if (persist) {
          try { localStorage.setItem(THEME_KEY, theme.id); } catch (e) {}
        }
        renderThemeUI();
      }

      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 2200);
      }

      function computeWalkCalories(mins, paceId) {
        const pace = PACES.find(p => p.id === paceId) || PACES[1];
        const netMet = Math.max(1.2, pace.met - 1.0);
        return Math.max(1, Math.round((netMet * 3.5 * state.settings.bodyWeightKg / 200) * mins));
      }

      function computeStreak() {
        let streak = 0;
        for (let i = 0; i < 60; i++) {
          const d = todayKey(-i);
          const hasActivity = state.foods.some(f => f.day === d) || state.walks.some(w => w.day === d);
          if (hasActivity) streak++;
          else if (i > 0) break;
        }
        return streak;
      }

      function getTodaySummary() {
        const day = todayKey(0);
        const ctxKey = state.contexts[day] || "NORMAL_ENERGY";
        const ctx = METABOLIC_STATES[ctxKey] || METABOLIC_STATES.NORMAL_ENERGY;
        const todayFoods = state.foods.filter(f => f.day === day);
        const todayWalks = state.walks.filter(w => w.day === day);
        const consumed = todayFoods.reduce((sum, f) => sum + f.calories, 0);
        const walkKcal = todayWalks.reduce((sum, w) => sum + w.caloriesBurned, 0);
        const walkMins = todayWalks.reduce((sum, w) => sum + w.durationMinutes, 0);
        const baseBurn = state.settings.estimatedBmrKcal + state.settings.baseNeatKcal;
        const totalBurn = baseBurn + walkKcal;
        const target = Math.max(1200, totalBurn - 350 + ctx.offset);
        return { day, ctxKey, ctx, todayFoods, todayWalks, consumed, walkKcal, walkMins, baseBurn, totalBurn, target };
      }

      function renderThemeUI() {
        const strip = document.getElementById("quickThemeStrip");
        strip.innerHTML = THEMES.map(t => `

            ${t.name}
          </button>
        `).join("");

        strip.querySelectorAll("[data-theme]").forEach(btn => {
          btn.addEventListener("click", () => {
            applyTheme(btn.getAttribute("data-theme"));
            showToast("Theme applied");
          });
        });

        const grid = document.getElementById("themeModalGrid");
        grid.innerHTML = THEMES.map(t => `
          <button type="button" class="theme-card ${t.id === currentThemeId ? "active" : ""}" data-modal-theme="${t.id}">
            <div class="swatch-bar" style="background:${t.vars["--bg"]}; border:1px solid ${t.vars["--border-strong"]};">
              <span class="swatch-dot" style="background:${t.vars["--primary"]}"></span>
              <span class="swatch-dot" style="background:${t.vars["--secondary"]}"></span>
              <span class="swatch-dot" style="background:${t.vars["--tertiary"]}"></span>
            </div>
            <div style="font-weight:700; font-size:13px;">${t.name}</div>
            <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">${t.desc}</div>
          </button>
        `).join("");

        grid.querySelectorAll("[data-modal-theme]").forEach(btn => {
          btn.addEventListener("click", () => {
            applyTheme(btn.getAttribute("data-modal-theme"));
            showToast("Theme updated");
          });
        });
      }

      function circleSvg(ratio, strokeVar) {
        const r = 36;
        const c = 2 * Math.PI * r;
        const clamped = Math.max(0, Math.min(1, ratio));
        const offset = c * (1 - clamped);
        return `
          <svg viewBox="0 0 92 92">
            <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--pill)" stroke-width="9"></circle>
            <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(${strokeVar})" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
          </svg>
        `;
      }

      function renderToday() {
        const s = getTodaySummary();
        const calRatio = s.consumed / Math.max(1, s.target);
        const actRatio = s.walkKcal / Math.max(1, state.settings.dailyWalkGoalKcal);
        const net = s.consumed - s.totalBurn;
        const netText = net <= 0 ? `${net} kcal deficit` : `+${net} kcal surplus`;
        const calRemaining = s.target - s.consumed;

        const timeline = [
          ...s.todayFoods.map(f => ({ ...f, kind: "food" })),
          ...s.todayWalks.map(w => ({ ...w, kind: "walk" }))

        return `
          <section class="card">

              <div>
                <div class="card-kicker">Metabolic Context</div>
                <div class="card-title">Today's State</div>
              </div>

            </div>
            <div class="pill-row">
              ${Object.entries(METABOLIC_STATES).map(([k, v]) => `

            </div>
            <div class="context-note">${s.ctx.note}</div>
          </section>

                  ${circleSvg(calRatio, "--secondary")}
                  <div class="ring-center">
                    <div class="ring-pct" style="color: var(--secondary);">${Math.round(calRatio * 100)}%</div>
                    <div class="ring-sub">intake</div>
                  </div>
                </div>
                <div class="ring-detail">${s.consumed} / ${s.target} kcal</div>
                <div class="ring-detail">${calRemaining >= 0 ? calRemaining + " kcal left" : Math.abs(calRemaining) + " kcal over"}</div>
              </div>

              <div class="ring-tile">
                <div class="ring-title">Activity Target</div>
                <div class="ring-wrap">
                  ${circleSvg(actRatio, "--primary")}
                  <div class="ring-center">
                    <div class="ring-pct" style="color: var(--primary);">${Math.round(actRatio * 100)}%</div>
                    <div class="ring-sub">active</div>
                  </div>
                </div>
                <div class="ring-detail">${s.walkKcal} / ${state.settings.dailyWalkGoalKcal} kcal</div>
                <div class="ring-detail">${s.walkMins} / ${state.settings.dailyWalkGoalMinutes} min walked</div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div class="card-title">Energy Balance Breakdown</div>
            </div>
            <div class="kpi-grid">
              <div class="kpi-box">
                <div class="kpi-label">Calories Consumed</div>
                <div class="kpi-val" style="color:var(--secondary)">${s.consumed} kcal</div>
                <div class="kpi-sub">${s.todayFoods.length} meals logged</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">Active Walk Burn</div>
                <div class="kpi-val" style="color:var(--primary)">${s.walkKcal} kcal</div>
                <div class="kpi-sub">${s.walkMins} min active</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">BMR + Base NEAT</div>
                <div class="kpi-val" style="color:var(--tertiary)">${s.baseBurn} kcal</div>
                <div class="kpi-sub">Resting baseline</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">Total Burn Today</div>
                <div class="kpi-val">${s.totalBurn} kcal</div>
                <div class="kpi-sub">Base + Active walk</div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div class="card-title">Today's Timeline</div>
              <button type="button" class="badge-soft badge-secondary" id="quickAddFoodBtn" style="cursor:pointer;">+ Meal</button>
            </div>
            <div class="stack">
              ${timeline.length === 0 ? `<div class="context-note">Nothing logged today yet. Tap Log Food or Log Walk below to start.</div>` : timeline.map(item => {
                if (item.kind === "food") {
                  return `
                    <div class="list-item">
                      <div class="item-main">
                        <div class="item-title">${item.name}</div>

                      </div>
                    </div>
                  `;
                }
                const pace = PACES.find(p => p.id === item.pace) || PACES[1];
                return `
                  <div class="list-item">
                    <div class="item-main">
                      <div class="item-title">${pace.name} · ${item.durationMinutes} min</div>
                      <div class="item-meta">${item.distanceKm ? item.distanceKm + " km · " : ""}${item.time}</div>
                    </div>
                    <div class="item-right">
                      <span class="kcal-tag" style="color:var(--primary)">-${item.caloriesBurned}</span>
                      <button class="del-btn" data-del-walk="${item.id}" type="button" aria-label="Delete walk">✕</button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }

      function renderFood() {
        const s = getTodaySummary();
        return `
          <section class="card" style="background:var(--secondary-soft); border-color:var(--secondary-border);">
            <div class="card-header" style="margin-bottom:0;">
              <div>
                <div class="card-kicker" style="color:var(--text);">Today's Intake</div>

        const minsPct = Math.min(100, Math.round((s.walkMins / Math.max(1, state.settings.dailyWalkGoalMinutes)) * 100));
        const kcalPct = Math.min(100, Math.round((s.walkKcal / Math.max(1, state.settings.dailyWalkGoalKcal)) * 100));

        return `

              <span class="badge-soft badge-primary">${minsPct}%</span>

              ${[15, 30, 45, 60].map(m => `
                <button type="button" class="choice-chip ${walkDuration === m ? "active" : ""}" data-mins="${m}">${m}m</button>
              `).join("")}
            </div>
            <div class="field-group">
              <label class="field-label" for="walkMinsInput">Duration (minutes)</label>
              <input id="walkMinsInput" type="number" value="${walkDuration}" />
            </div>

            <div class="field-label" style="margin-bottom:6px;">Pace</div>
            ${PACES.map(p => `
              <div class="pace-card ${p.id === walkPaceId ? "active" : ""}" data-pace="${p.id}">
                <div>
                  <div style="font-weight:700; font-size:13.5px;">${p.name}</div>
                  <div style="font-size:11.5px; color:var(--text-secondary);">${p.sub}</div>
                </div>
                <strong style="color:var(--primary);">~${computeWalkCalories(walkDuration, p.id)} kcal</strong>
              </div>
            `).join("")}

            <div class="two-col" style="margin-top:10px;">
              <div class="field-group">
                <label class="field-label" for="walkDistInput">Distance km (opt)</label>
                <input id="walkDistInput" type="number" step="0.1" placeholder="e.g., 2.6" />
              </div>
              <div class="field-group">
                <label class="field-label" for="walkOverrideInput">Override kcal (opt)</label>
                <input id="walkOverrideInput" type="number" placeholder="${estKcal}" />
              </div>
            </div>
            <button id="logWalkBtn" class="btn-primary" type="button">Log Walk · ${estKcal} kcal</button>
          </section>
        `;
      }

      function renderTrends() {
        const days = Array.from({ length: 7 }, (_, i) => todayKey(i - 6));
        const rawPoints = days.map(d => {
          const rec = state.weights.find(w => w.day === d);
          return rec ? rec.weightKg : null;
        });
        const rollingPoints = rawPoints.map((_, idx) => {
          const slice = rawPoints.slice(0, idx + 1).filter(v => v !== null);
          if (!slice.length) return null;
          return slice.reduce((a, b) => a + b, 0) / slice.length;
        });

        const valid = [...rawPoints, ...rollingPoints].filter(v => v !== null);
        const minW = valid.length ? Math.min(...valid) - 0.5 : 80;
        const maxW = valid.length ? Math.max(...valid) + 0.5 : 90;
        const span = Math.max(1, maxW - minW);

        const W = 320, H = 140, padX = 16, padY = 16;
        const xFor = i => padX + (i / 6) * (W - padX * 2);
        const yFor = w => padY + (1 - (w - minW) / span) * (H - padY * 2);

        const rawPath = rawPoints.map((w, i) => w === null ? "" : `${i === 0 || rawPoints.slice(0, i).every(v => v === null) ? "M" : "L"}${xFor(i).toFixed(1)},${yFor(w).toFixed(1)}`).join(" ");
        const avgPath = rollingPoints.map((w, i) => w === null ? "" : `${i === 0 || rollingPoints.slice(0, i).every(v => v === null) ? "M" : "L"}${xFor(i).toFixed(1)},${yFor(w).toFixed(1)}`).join(" ");

        const todayW = state.weights.find(w => w.day === todayKey(0));
        const latestAvg = rollingPoints.filter(v => v !== null).slice(-1)[0];
        const latestRaw = rawPoints.filter(v => v !== null).slice(-1)[0];

        return `
          <section class="card">
            <div class="card-header">
              <div class="card-title">Daily Weight Check-In</div>
              ${todayW ? `<span class="badge-soft badge-primary">Logged</span>` : ""}
            </div>
            <div class="two-col">
              <div class="field-group">
                <label class="field-label" for="weightInput">Scale weight (kg)</label>
                <input id="weightInput" type="number" step="0.1" value="${(todayW ? todayW.weightKg : state.settings.bodyWeightKg).toFixed(1)}" />
              </div>
              <div class="field-group">
                <label class="field-label" for="weightTagSelect">Context Tag</label>
                <select id="weightTagSelect">
                  <option ${todayW?.tag === "Normal" ? "selected" : ""}>Normal</option>
                  <option ${todayW?.tag === "Bloated / Water Retention" ? "selected" : ""}>Bloated / Water Retention</option>
                  <option ${todayW?.tag === "Post-Meal" ? "selected" : ""}>Post-Meal</option>
                </select>
              </div>
            </div>
            <button id="saveWeightBtn" class="btn-secondary" type="button">Save Check-In</button>
          </section>

          <section class="card">
            <div class="card-header">
              <div>
                <div class="card-title">7-Day Weight Trend</div>
                <div class="date-sub">Rolling average filters single-day water spikes</div>
              </div>
            </div>
            <div class="chart-box">
              <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:150px; display:block;">
                <line x1="${padX}" y1="${padY}" x2="${W - padX}" y2="${padY}" stroke="var(--border)" stroke-width="1"/>
                <line x1="${padX}" y1="${H / 2}" x2="${W - padX}" y2="${H / 2}" stroke="var(--border)" stroke-width="1"/>
                <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="var(--border)" stroke-width="1"/>
                ${rawPath ? `<path d="${rawPath}" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-dasharray="5 5" opacity="0.65"/>` : ""}
                ${avgPath ? `<path d="${avgPath}" fill="none" stroke="var(--secondary)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
                ${rawPoints.map((w, i) => w === null ? "" : `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(w).toFixed(1)}" r="3.6" fill="var(--text-secondary)"/>`).join("")}
                ${rollingPoints.map((w, i) => w === null ? "" : `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(w).toFixed(1)}" r="3.4" fill="var(--secondary)"/>`).join("")}
              </svg>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-top:4px;">
              ${days.map(d => `<span>${shortDayLabel(d)}</span>`).join("")}
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Scale Noise vs. Real Trend</div>
                <div class="date-sub">${latestRaw && latestAvg && latestRaw - latestAvg > 0.3 ? "Today's raw bump is above your 7-day average — likely water retention." : "Trendline is steady and tracking closely with effort."}</div>
              </div>
            </div>
            <div class="kpi-grid">
              <div class="kpi-box">
                <div class="kpi-label">Latest Raw</div>
                <div class="kpi-val">${latestRaw ? latestRaw.toFixed(1) + " kg" : "--"}</div>
              </div>
              <div class="kpi-box" style="background:var(--secondary-soft); border-color:var(--secondary-border);">
                <div class="kpi-label">7d Rolling Avg</div>
                <div class="kpi-val" style="color:var(--secondary);">${latestAvg ? latestAvg.toFixed(1) + " kg" : "--"}</div>
              </div>
            </div>
          </section>
        `;
      }

      function attachViewListeners() {
        if (currentTab === "today") {
          document.querySelectorAll("[data-ctx]").forEach(btn => {
            btn.addEventListener("click", () => {
              state.contexts[todayKey(0)] = btn.getAttribute("data-ctx");
              saveState(state);
              render();
            });
          });
          document.getElementById("quickAddFoodBtn")?.addEventListener("click", () => switchTab("food"));
          document.querySelectorAll("[data-del-food]").forEach(btn => {
            btn.addEventListener("click", () => {
              const id = btn.getAttribute("data-del-food");
              state.foods = state.foods.filter(f => f.id !== id);
              saveState(state);
              render();
              showToast("Meal removed");
            });
          });
          document.querySelectorAll("[data-del-walk]").forEach(btn => {
            btn.addEventListener("click", () => {
              const id = btn.getAttribute("data-del-walk");
              state.walks = state.walks.filter(w => w.id !== id);
              saveState(state);
              render();
              showToast("Walk removed");
            });
          });
        } else if (currentTab === "food") {
          document.querySelectorAll("[data-preset-id]").forEach(card => {
            card.addEventListener("click", () => {
              const p = state.presets.find(x => x.id === card.getAttribute("data-preset-id"));
              if (!p) return;
              state.foods.push({
                id: "f_" + Date.now(),
                day: todayKey(0),
                time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
                name: p.name,
                calories: p.calories,
                category: p.category
              });
              saveState(state);
              render();
              showToast(`Logged ${p.name}`);
            });
          });
          document.getElementById("logCustomFoodBtn")?.addEventListener("click", () => {
            const name = document.getElementById("foodName").value.trim();
            const kcal = parseInt(document.getElementById("foodKcal").value, 10);
            const cat = document.getElementById("foodCat").value;
            const savePreset = document.getElementById("saveAsPresetCheck").checked;
            if (!name || isNaN(kcal) || kcal <= 0) {
              showToast("Enter a valid meal name and calories");
              return;
            }
            state.foods.push({
              id: "f_" + Date.now(),
              day: todayKey(0),
              time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
              name,
              calories: kcal,
              category: cat
            });
            if (savePreset) {
              state.presets.unshift({ id: "p_" + Date.now(), name, calories: kcal, category: cat });
            }
            saveState(state);
            render();
            showToast(`Logged ${name}`);
          });
        } else if (currentTab === "walk") {
          document.querySelectorAll("[data-mins]").forEach(btn => {
            btn.addEventListener("click", () => {
              walkDuration = parseInt(btn.getAttribute("data-mins"), 10);
              render();
            });
          });
          document.getElementById("walkMinsInput")?.addEventListener("input", e => {
            walkDuration = Math.max(1, parseInt(e.target.value, 10) || 1);
            const btn = document.getElementById("logWalkBtn");
            if (btn) btn.textContent = `Log Walk · ${computeWalkCalories(walkDuration, walkPaceId)} kcal`;
          });
          document.querySelectorAll("[data-pace]").forEach(card => {
            card.addEventListener("click", () => {
              walkPaceId = card.getAttribute("data-pace");
              render();
            });
          });
          document.getElementById("logWalkBtn")?.addEventListener("click", () => {
            const mins = Math.max(1, parseInt(document.getElementById("walkMinsInput").value, 10) || walkDuration);
            const distVal = parseFloat(document.getElementById("walkDistInput").value);
            const overrideVal = parseInt(document.getElementById("walkOverrideInput").value, 10);
            const kcal = !isNaN(overrideVal) && overrideVal > 0 ? overrideVal : computeWalkCalories(mins, walkPaceId);
            state.walks.push({
              id: "w_" + Date.now(),
              day: todayKey(0),
              time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
              durationMinutes: mins,
              pace: walkPaceId,
              distanceKm: !isNaN(distVal) && distVal > 0 ? distVal : null,
              caloriesBurned: kcal
            });
            saveState(state);
            render();
            showToast(`Walk logged (${kcal} kcal)`);
          });
        } else if (currentTab === "trends") {
          document.getElementById("saveWeightBtn")?.addEventListener("click", () => {
            const w = parseFloat(document.getElementById("weightInput").value);
            const tag = document.getElementById("weightTagSelect").value;
            if (isNaN(w) || w < 30 || w > 250) {
              showToast("Enter a weight between 30 and 250 kg");
              return;
            }
            const day = todayKey(0);
            state.weights = state.weights.filter(x => x.day !== day);
            state.weights.push({ day, weightKg: w, tag });
            state.settings.bodyWeightKg = w;
            saveState(state);
            render();
            showToast("Weight check-in saved");
          });
        }
      }

      function render() {
        document.getElementById("todayDateLabel").textContent = new Date().toLocaleDateString(undefined, {
          weekday: "long", month: "short", day: "numeric"
        });
        document.getElementById("streakPill").textContent = `🔥 ${computeStreak()}d`;

        document.querySelectorAll(".nav-btn").forEach(btn => {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === currentTab);
        });

        const container = document.getElementById("mainContent");
        if (currentTab === "today") container.innerHTML = renderToday();
        else if (currentTab === "food") container.innerHTML = renderFood();
        else if (currentTab === "walk") container.innerHTML = renderWalk();
        else container.innerHTML = renderTrends();

        attachViewListeners();
      }

      function switchTab(tab, pushHistory = true) {
        if (tab === currentTab) return;
        currentTab = tab;
        if (pushHistory && window.history && window.history.pushState) {
          window.history.pushState({ tab }, "", "#" + tab);
        }
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      window.addEventListener("popstate", (event) => {
        const modalOpen = document.querySelector(".modal-backdrop.open");
        if (modalOpen) {
          modalOpen.classList.remove("open");
          return;
        }
        const targetTab = (event.state && event.state.tab) || (location.hash ? location.hash.slice(1) : "today");
        if (["today", "food", "walk", "trends"].includes(targetTab)) {
          currentTab = targetTab;
          render();
        }
      });

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
      });

      const themeModal = document.getElementById("themeModal");
      const settingsModal = document.getElementById("settingsModal");

      document.getElementById("openThemesBtn").addEventListener("click", () => themeModal.classList.add("open"));
      document.getElementById("closeThemeModal").addEventListener("click", () => themeModal.classList.remove("open"));
      themeModal.addEventListener("click", e => { if (e.target === themeModal) themeModal.classList.remove("open"); });

      document.getElementById("openSettingsBtn").addEventListener("click", () => {
        document.getElementById("setWeight").value = state.settings.bodyWeightKg;
        document.getElementById("setBmr").value = state.settings.estimatedBmrKcal;
        document.getElementById("setNeat").value = state.settings.baseNeatKcal;
        document.getElementById("setWalkMins").value = state.settings.dailyWalkGoalMinutes;
        document.getElementById("setWalkKcal").value = state.settings.dailyWalkGoalKcal;
        settingsModal.classList.add("open");
      });
      document.getElementById("closeSettingsModal").addEventListener("click", () => settingsModal.classList.remove("open"));
      settingsModal.addEventListener("click", e => { if (e.target === settingsModal) settingsModal.classList.remove("open"); });

      document.getElementById("saveSettingsBtn").addEventListener("click", () => {
        state.settings.bodyWeightKg = parseFloat(document.getElementById("setWeight").value) || state.settings.bodyWeightKg;
        state.settings.estimatedBmrKcal = parseInt(document.getElementById("setBmr").value, 10) || state.settings.estimatedBmrKcal;
        state.settings.baseNeatKcal = parseInt(document.getElementById("setNeat").value, 10) || state.settings.baseNeatKcal;
        state.settings.dailyWalkGoalMinutes = parseInt(document.getElementById("setWalkMins").value, 10) || state.settings.dailyWalkGoalMinutes;
        state.settings.dailyWalkGoalKcal = parseInt(document.getElementById("setWalkKcal").value, 10) || state.settings.dailyWalkGoalKcal;
        saveState(state);
        settingsModal.classList.remove("open");
        render();
        showToast("Targets saved");
      });

      document.getElementById("exportJsonBtn").addEventListener("click", async () => {
        const json = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(json);
          showToast("Backup JSON copied");
        } catch (e) {
          window.prompt("Copy your HealthForce JSON backup:", json);
        }
      });

      document.getElementById("importJsonBtn").addEventListener("click", () => {
        const input = window.prompt("Paste HealthForce JSON backup:");
        if (!input) return;
        try {
          const parsed = JSON.parse(input);
          if (!parsed || !parsed.settings || !Array.isArray(parsed.foods)) throw new Error("Invalid format");
          saveState(parsed);
          settingsModal.classList.remove("open");
          render();
          showToast("Backup restored");
        } catch (e) {
          showToast("Invalid JSON backup");
        }
      });

      document.getElementById("clearSampleBtn").addEventListener("click", () => {
        saveState({
          settings: state.settings,
          contexts: {},
          presets: [...DEFAULT_PRESETS],
          foods: [],
          walks: [],
          weights: []
        });
        settingsModal.classList.remove("open");
        render();
        showToast("Started fresh");
      });

      if (window.history && window.history.replaceState) {
        window.history.replaceState({ tab: "today" }, "", "#today");
      }
      applyTheme(currentThemeId, false);
      render();
    })();
  </script>
</body>
</html>
